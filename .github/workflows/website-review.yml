name: Website browser review
on:
  push:
    branches: [v36-conversion-review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save @playwright/test@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8000 > /tmp/nuntda-http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/v36-3.html >/dev/null && break; sleep 1; done
          npx playwright test qa/website.spec.cjs --workers=1 --reporter=list
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: test-results/
          if-no-files-found: ignore
